name: translator-summary-bot

on:
  schedule:
    # تشغيل كل 5 دقائق؛ الكود يفرض نافذة 09:45–16:30 بتوقيت الرياض
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: translator-summary-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tradingview-screener

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
